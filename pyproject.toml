[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doctools"
version = "0.1.0"
description = "PDF merge and doc tools"
requires-python = ">=3.9"
dependencies = [
    "pypdf",
    "cryptography>=3.1",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "python-docx>=1.0.0",
    "pymupdf>=1.24.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
ocr = [
    "ocrmypdf",
]
ai = [
    "openai",
]
ppt = [
    "python-pptx>=0.6.21",
    "pillow>=9.0.0",
]
faces = [
    "fiftyone",
    "insightface",
    "onnxruntime",
    "opencv-python",
    "numpy",
    "scikit-learn",
    "tqdm",
]
video = [
    "yt-dlp[default]",
]
paddle = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0,<3.3",
    "pypdfium2>=5.0.0",
    "pymupdf>=1.24.0",
]
gphoto = [
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "requests>=2.28.0",
]
all = [
    "ocrmypdf",
    "openai",
    "python-pptx>=0.6.21",
    "pillow>=9.0.0",
    "python-docx>=1.0.0",
    "fiftyone",
    "insightface",
    "onnxruntime",
    "opencv-python",
    "numpy",
    "scikit-learn",
    "tqdm",
    "yt-dlp[default]",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0,<3.3",
    "pypdfium2>=5.0.0",
    "pymupdf>=1.24.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "requests>=2.28.0",
]

[dependency-groups]
dev = []
ocr = [
    "ocrmypdf",
]
ai = [
    "openai",
]
ppt = [
    "python-pptx>=0.6.21",
    "pillow>=9.0.0",
]
faces = [
    "fiftyone",
    "insightface",
    "onnxruntime",
    "opencv-python",
    "numpy",
    "scikit-learn",
    "tqdm",
]
video = [
    "yt-dlp[default]",
]
paddle = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0,<3.3",
    "pypdfium2>=5.0.0",
    "pymupdf>=1.24.0",
]
gphoto = [
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "requests>=2.28.0",
]
common = [
    { include-group = "ocr" },
    { include-group = "ai" },
    { include-group = "ppt" },
    { include-group = "video" },
    { include-group = "paddle" },
]
all = [
    { include-group = "common" },
    { include-group = "faces" },
    { include-group = "gphoto" },
]

[tool.uv]
default-groups = []

[tool.setuptools]
packages = []
